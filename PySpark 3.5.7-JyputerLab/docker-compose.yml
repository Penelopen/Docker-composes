version: '3.7'
volumes:
  shared-workspace:
    name: "hadoop-distributed-file-system"
    driver: local

services:
  spark-master:
    image: andreper/spark-master:3.5.7
    container_name: spark-master
    ports:
      - 8085:8080
      - 7077:7077
    volumes:
      - shared-workspace:/opt/workspace
    networks:
      - hadoop-net
  spark-worker-1:
    image: andreper/spark-worker:3.5.7
    container_name: spark-worker1
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1000m
    ports:
      - 8083:8081
    volumes:
      - shared-workspace:/opt/workspace
    depends_on:
      - spark-master
    networks:
      - hadoop-net
  spark-worker-2:
    image: andreper/spark-worker:3.5.7
    container_name: spark-worker2
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1000m
    ports:
      - 8084:8081
    volumes:
      - shared-workspace:/opt/workspace
    depends_on:
      - spark-master
    networks:
      - hadoop-net
  jupyterlab:
    image: andreper/jupyterlab:4.4.10-spark-3.5.7
    container_name: jupyterlab
    ports:
      - 8888:8888
      - 4040:4040
    volumes:
      - shared-workspace:/opt/workspace
    networks:
      - hadoop-net

networks:
  hadoop-net:
#    external: true
